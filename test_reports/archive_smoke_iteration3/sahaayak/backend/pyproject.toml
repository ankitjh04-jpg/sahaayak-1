[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sahaayak-backend"
version = "1.1.0"
description = "Sahaayak farmer and agricultural expert API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.1", "uvicorn==0.25.0", "motor==3.3.1", "pymongo==4.6.3",
  "pydantic==2.13.5", "httpx==0.28.1", "python-multipart==0.0.32", "python-dotenv==1.2.3"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23", "requests>=2.32", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]